<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Update · GIPS Alumni Meet 2026</title>
  <meta name="description" content="Daily attendance and score updates for approved admin users." />
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <aside class="side-nav" id="side-nav">
    <a class="side-brand" href="index.html" data-page="index.html" aria-label="Go to home">
      <img class="gips-logo" src="assets/logo.png" alt="GIPS crest" />
      <span><strong id="side-brand-short">GIPS</strong><small id="side-brand-event">Alumni Meet 2026</small></span>
    </a>
    <nav class="side-nav-links" aria-label="Main navigation">
      <a class="side-nav-link" href="index.html" data-nav="home" data-page="index.html" aria-label="Home" title="Home"><i data-lucide="house"></i><span>Home</span></a>
      <a class="side-nav-link" href="index.html#about" data-nav="about" data-page="index.html" aria-label="About" title="About"><i data-lucide="info"></i><span>About</span></a>
      <a class="side-nav-link" href="index.html#departments" data-nav="departments" data-page="index.html" aria-label="Departments" title="Departments"><i data-lucide="layout-grid"></i><span>Departments</span></a>
      <a class="side-nav-link" href="index.html#leaderboard" data-nav="leaderboard" data-page="index.html" aria-label="Leaderboard" title="Leaderboard"><i data-lucide="trophy"></i><span>Leaderboard</span></a>
      <a class="side-nav-link" href="index.html#progress" data-nav="progress" data-page="index.html" aria-label="Progress" title="Progress"><i data-lucide="chart-no-axes-combined"></i><span>Progress</span></a>
      <a class="side-nav-link" href="analytics.html" data-nav="analytics" data-page="analytics.html" aria-label="Analytics" title="Analytics"><i data-lucide="line-chart"></i><span>Analytics</span></a>
      <a class="side-nav-link" href="members.html" data-nav="registered-members" data-page="members.html" aria-label="Members" title="Members"><i data-lucide="users"></i><span>Members</span></a>
      <a class="side-nav-link active" href="daily-update.html" data-nav="daily-update" data-page="daily-update.html" aria-label="Daily Update" title="Daily Update"><i data-lucide="clipboard-pen-line"></i><span>Daily Update</span></a>
      <a class="side-nav-link" href="attendance.html" data-nav="attendance" data-page="attendance.html" aria-label="Attendance" title="Attendance"><i data-lucide="calendar-check"></i><span>Attendance</span></a>
      <a class="side-nav-link" href="register.html" data-nav="register" data-page="register.html" aria-label="Register" title="Register"><i data-lucide="user-plus"></i><span>Register</span></a>
    </nav>
  </aside>

  <main style="padding-left: 0; min-height: 100vh;">
    <section id="daily-update" class="attendance-section" style="padding-top: 48px;">
      <div class="section-head"><h2 class="serif section-title">Daily Attendance & Performance</h2><p class="section-sub">Admin access is required to update daily records.</p></div>
      <div class="attendance-panel">
        <form class="admin-login-form" id="admin-login-form">
          <div><h3 class="serif admin-login-title">Admin access</h3><p class="admin-login-copy">Sign in to mark attendance and update scores.</p></div>
          <label>Email<input id="admin-email" type="email" required /></label>
          <label>Password<input id="admin-password" type="password" required /></label>
          <button class="btn btn-primary" id="admin-login-button" type="submit">Admin Login</button>
          <p id="admin-login-status" class="attendance-status"></p>
        </form>
        <div id="admin-only-content" hidden>
          <div class="attendance-toolbar">
            <label>Date<input id="performance-date" type="date" /></label>
            <div class="attendance-actions"><span id="admin-session-label"></span><button class="btn btn-ghost" id="admin-logout" data-logout type="button">Log out</button><button class="btn btn-primary" id="save-performance" type="button">Save Daily Update</button></div>
          </div>
          <div class="attendance-table-wrap"><table class="attendance-table"><thead><tr><th>Member</th><th>Attendance</th><th>Score / 100</th><th>Remarks</th></tr></thead><tbody id="attendance-rows"></tbody></table></div>
          <p id="attendance-status" class="attendance-status"></p>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/lucide.min.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/supabase-config.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
