<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance · GIPS Alumni Meet 2026</title>
  <meta name="description" content="Attendance history and daily performance tracking for alumni team members." />
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <aside class="side-nav" id="side-nav">
    <a class="side-brand" href="index.html" data-page="index.html" aria-label="Go to home">
      <img class="gips-logo" src="assets/logo.png" alt="GIPS crest" />
      <span><strong id="side-brand-short">GIPS</strong><small id="side-brand-event">Alumni Meet 2026</small></span>
    </a>
    <nav class="side-nav-links" aria-label="Main navigation">
      <a class="side-nav-link" href="index.html" data-nav="home" data-page="index.html" aria-label="Home" title="Home"><i data-lucide="house"></i><span>Home</span></a>
      <a class="side-nav-link" href="index.html#about" data-nav="about" data-page="index.html" aria-label="About" title="About"><i data-lucide="info"></i><span>About</span></a>
      <a class="side-nav-link" href="index.html#departments" data-nav="departments" data-page="index.html" aria-label="Departments" title="Departments"><i data-lucide="layout-grid"></i><span>Departments</span></a>
      <a class="side-nav-link" href="index.html#leaderboard" data-nav="leaderboard" data-page="index.html" aria-label="Leaderboard" title="Leaderboard"><i data-lucide="trophy"></i><span>Leaderboard</span></a>
      <a class="side-nav-link" href="index.html#progress" data-nav="progress" data-page="index.html" aria-label="Progress" title="Progress"><i data-lucide="chart-no-axes-combined"></i><span>Progress</span></a>
      <a class="side-nav-link" href="analytics.html" data-nav="analytics" data-page="analytics.html" aria-label="Analytics" title="Analytics"><i data-lucide="line-chart"></i><span>Analytics</span></a>
      <a class="side-nav-link" href="members.html" data-nav="registered-members" data-page="members.html" aria-label="Members" title="Members"><i data-lucide="users"></i><span>Members</span></a>
      <a class="side-nav-link" href="daily-update.html" data-nav="daily-update" data-page="daily-update.html" aria-label="Daily Update" title="Daily Update"><i data-lucide="clipboard-pen-line"></i><span>Daily Update</span></a>
      <a class="side-nav-link active" href="attendance.html" data-nav="attendance" data-page="attendance.html" aria-label="Attendance" title="Attendance"><i data-lucide="calendar-check"></i><span>Attendance</span></a>
      <a class="side-nav-link" href="register.html" data-nav="register" data-page="register.html" aria-label="Register" title="Register"><i data-lucide="user-plus"></i><span>Register</span></a>
    </nav>
  </aside>

  <main style="padding-left: 0; min-height: 100vh;">
    <section id="attendance" class="public-attendance-section" style="padding-top: 48px;">
      <div class="section-head"><h2 class="serif section-title">Attendance History</h2><p class="section-sub">View attendance only after a daily update has been saved.</p></div>
      <div class="public-attendance-panel">
        <div class="public-attendance-toolbar">
          <label>Date<input id="public-attendance-date" type="date" /></label>
          <div class="attendance-summary" id="attendance-summary"></div>
        </div>
        <div class="attendance-search-row"><input id="public-attendance-search" type="search" placeholder="Search member" /><select id="public-attendance-department"><option value="all">All departments</option></select></div>
        <div id="public-attendance-content"><p class="attendance-empty">Loading attendance records...</p></div>
      </div>
    </section>
  </main>

  <script src="assets/lucide.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
